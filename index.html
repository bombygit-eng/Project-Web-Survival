
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project: Web Survival</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <div>
                <h1>Project: Web Survival</h1>
                <p class="subtitle">How long can you survive?</p>
            </div>

            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">HEALTH: </span>
                    <span id="health">❤️ ❤️ ❤️</span>
                </div>

                <div class="stat">
                    <span class="stat-label">SCORE: </span>
                    <span id="score">0</span>
                </div>
            </div>
        </header>

        <section class="arena-container">
            <canvas id="gameCanvas" width="900" height="600">
                Your browser does not support HTML Canvas.
            </canvas>

            <div class="overlay" id="menuOverlay">
                <h2>Project: Web Survival</h2>
                <p>How long can you survive?</p>
                <button class="menu-button" id="startButton">START</button>
            </div>

            <div class="overlay" id="gameOverOverlay" hidden>
                <h2>GAME OVER</h2>
                <p>Score: <span id="finalScore">0</span></p>
                <button class="menu-button" id="restartButton">PLAY AGAIN</button>
                <button class="menu-button secondary" id="menuButton">MAIN MENU</button>
            </div>
        </section>

        <section class="touch-controls">
            <div class="joystick" id="moveStick">
                <div class="joystick-knob"></div>
            </div>
            <div class="joystick" id="aimStick">
                <div class="joystick-knob"></div>
            </div>
        </section>

        <footer class="game-footer">
            <p class="controls-desktop">MOVE: WASD / ARROWS &nbsp;·&nbsp; SHOOT: MOUSE (HOLD)</p>
            <p class="controls-touch">MOVE: LEFT STICK &nbsp;·&nbsp; SHOOT: RIGHT STICK</p>
            <p>OBJECTIVE: SURVIVE</p>
        </footer>
    </main>
</body>
</html>
